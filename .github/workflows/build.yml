name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-AV-Windows
          path: release/*.exe
