name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Prepare verified ClamAV engine (synthetic signatures only)
        run: node scripts/prepare-monitor-fixtures.cjs
      - name: Real ClamAV exit codes
        run: npm run test:integration
      - name: Build background process host
        run: npm run build:service
      - name: Continuous scanning and restart recovery
        shell: pwsh
        run: |
          $env:SENTINEL_TEST_HOST = Join-Path $PWD 'service/SentinelMonitor.exe'
          npm run test:monitor
      # Renderer, IPC validation, fatal-fault handling, and failure propagation. The real-engine
      # scenarios skip with a visible note because CI has no prepared ClamAV fixtures.
      - name: Electron smoke scenarios
        run: npm run test:smoke
      - name: Build installer
        run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Sentinel-AV-Windows
          path: release/*.exe
