# Reference configuration; the agent writes a profile-specific version with its database and limits.
# A random free loopback port avoids collisions with other ClamAV installations.
Foreground yes
TCPAddr 127.0.0.1
TCPSocket 3310
MaxThreads 1
MaxQueue 4
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 200M
MaxScanTime 60000
AlertExceedsMax yes
ConcurrentDatabaseReload no
